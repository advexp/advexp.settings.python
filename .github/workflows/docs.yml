name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          pip install mkdocs==1.6.1 zensical==0.1.0
          mkdocstrings==1.0.8 mkdocstrings-python==2.0.10 griffelib==2.4.1
      - run: pip install -e packages/advexp-settings-base -e packages/advexp-settings -e packages/advexp-configuration
      - run: zensical build --strict -f docs-site/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
