version = 1

# The REUSE coverage of the public repository. Its tree differs from the
# private monorepo: the badge assets sit in assets/, and there is no
# scripts/ or texts/. This file rides the overlay and replaces the
# private REUSE.toml in the snapshot wholesale.

[[annotations]]
path = [
    "CHANGELOG.md",
    "README.md",
    "assets/*",
    "docs-site/**",
    "packages/advexp-configuration/pyproject.toml",
    "packages/advexp-configuration/README.md",
    "packages/advexp-configuration/setup.cfg",
    "packages/advexp-settings/pyproject.toml",
    "packages/advexp-settings/README.md",
    "packages/advexp-settings/setup.cfg",
    "packages/advexp-settings-base/pyproject.toml",
    "packages/advexp-settings-base/README.md",
    "packages/advexp-settings-base/setup.cfg",
    "pyproject.toml",
    "samples/**",
    "tests/**",
]
SPDX-FileCopyrightText = "2026 Alexey Ivakin"
SPDX-License-Identifier = "Apache-2.0"
